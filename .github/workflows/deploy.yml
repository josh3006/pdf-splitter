name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select deployment image
        id: image
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to RackNerd
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main' || github.ref_name == 'master' || github.event_name == 'workflow_dispatch'
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Check deployment secrets
        id: preflight
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for key in PROD_SSH_HOST PROD_SSH_USER PROD_SSH_PRIVATE_KEY PROD_DEPLOY_PATH APP_PASSWORD FLASK_SECRET_KEY; do
            if [ -z "${!key}" ]; then
              echo "::warning::$key is not configured"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Deployment secrets are missing"
              exit 1
            fi
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Prepare SSH
        if: steps.preflight.outputs.ready == 'true'
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment files
        if: steps.preflight.outputs.ready == 'true'
        env:
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          NGINX_DEPLOY_PATH: ${{ vars.NGINX_DEPLOY_PATH || '' }}
        run: |
          set -euo pipefail
          ssh "$PROD_SSH_USER@$PROD_SSH_HOST" "mkdir -p '$PROD_DEPLOY_PATH'"
          scp deploy/docker-compose.prod.yml "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/docker-compose.yml"
          if [ -n "$NGINX_DEPLOY_PATH" ]; then
            ssh "$PROD_SSH_USER@$PROD_SSH_HOST" "mkdir -p '$NGINX_DEPLOY_PATH/templates'"
            scp deploy/nginx/templates/pdfsplitter.http.conf deploy/nginx/templates/pdfsplitter.https.conf "$PROD_SSH_USER@$PROD_SSH_HOST:$NGINX_DEPLOY_PATH/templates/"
          fi

      - name: Create production env file
        if: steps.preflight.outputs.ready == 'true'
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          APP_USERNAME: ${{ vars.APP_USERNAME || 'admin' }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          APP_PORT: ${{ vars.APP_PORT || '8081' }}
          WEB_CONCURRENCY: ${{ vars.WEB_CONCURRENCY || '2' }}
          GUNICORN_TIMEOUT: ${{ vars.GUNICORN_TIMEOUT || '120' }}
          PROXY_NETWORK: ${{ vars.PROXY_NETWORK || 'proxy' }}
        run: |
          set -euo pipefail
          {
            printf 'APP_IMAGE=%s\n' "$APP_IMAGE"
            printf 'APP_USERNAME=%s\n' "$APP_USERNAME"
            printf 'APP_PASSWORD=%s\n' "$APP_PASSWORD"
            printf 'FLASK_SECRET_KEY=%s\n' "$FLASK_SECRET_KEY"
            printf 'APP_PORT=%s\n' "$APP_PORT"
            printf 'WEB_CONCURRENCY=%s\n' "$WEB_CONCURRENCY"
            printf 'GUNICORN_TIMEOUT=%s\n' "$GUNICORN_TIMEOUT"
            printf 'PROXY_NETWORK=%s\n' "$PROXY_NETWORK"
          } > deploy.env

      - name: Copy production env file
        if: steps.preflight.outputs.ready == 'true'
        env:
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp deploy.env "$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_DEPLOY_PATH/.env"

      - name: Deploy container
        if: steps.preflight.outputs.ready == 'true'
        env:
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          PROXY_NETWORK: ${{ vars.PROXY_NETWORK || 'proxy' }}
        run: |
          set -euo pipefail
          ssh "$PROD_SSH_USER@$PROD_SSH_HOST" "
            set -euo pipefail
            cd '$PROD_DEPLOY_PATH'
            docker network inspect '$PROXY_NETWORK' >/dev/null 2>&1 || docker network create '$PROXY_NETWORK'
            echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin
            for attempt in 1 2 3; do
              if docker compose pull; then
                break
              fi
              if [ \"\$attempt\" -eq 3 ]; then
                exit 1
              fi
              sleep \$((attempt * 20))
            done
            docker compose up -d
            docker image prune -f
            docker compose ps
          "
